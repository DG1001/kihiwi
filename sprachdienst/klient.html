<!doctype html>
<meta charset="utf-8">
<title>kihiwi — Sprachclient</title>
<style>
  :root { --bg:#101014; --fg:#e8e8ea; --matt:#8a8a95; --linie:#2a2a33; --an:#3d9a54;
          /* Warnstufen der Anzeigetafel. --an ist das vorhandene Gruen. */
          --gelb:#c9a227; --rot:#c0453b; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }

  /* Zwei Spalten: links das Gespraech, rechts die Buehne. Der Verlauf ist ein
     mitlaufendes Protokoll und braucht wenig Breite; alles Ausfuehrliche --
     Recherchen, Protokolle, die Hilfe -- gehoert auf die Flaeche daneben.
     Vorher stand beides untereinander in einer 44rem-Spalte, und ein
     Rechercheergebnis schob den Verlauf aus dem Bild. */
  body { background:var(--bg); color:var(--fg); font:15px/1.55 system-ui,sans-serif;
         display:grid; grid-template-columns:25rem 1fr; overflow:hidden; }
  #seite { display:flex; flex-direction:column; min-height:0;
           border-right:1px solid var(--linie); padding:1.2rem 1.2rem 0; }
  #buehne { display:flex; flex-direction:column; min-height:0; min-width:0; }

  @media (max-width:62rem) {
    html,body { height:auto; }
    body { grid-template-columns:1fr; overflow:visible; }
    #seite { border-right:none; border-bottom:1px solid var(--linie);
             padding-bottom:1.2rem; }
    #verlauf { max-height:22rem; }
    #buehne { height:auto; min-height:70vh; }
  }

  h1 { font-size:1.05rem; font-weight:600; margin-bottom:.15rem; }
  .matt { color:var(--matt); }
  #kopf { display:flex; align-items:baseline; justify-content:space-between;
          gap:.8rem; border-bottom:1px solid var(--linie);
          padding-bottom:.7rem; margin-bottom:.8rem; flex:none; }
  #geraet { font-size:.8rem; }
  #phase { font-size:1.15rem; font-weight:600; white-space:nowrap; }
  .knoepfe { display:flex; gap:.5rem; flex-wrap:wrap; margin:.6rem 0; flex:none; }
  button { font:inherit; padding:.5rem 1rem; border-radius:.4rem; cursor:pointer;
           border:1px solid var(--linie); background:#1c1c24; color:var(--fg); }
  button:hover:not(:disabled) { border-color:#4a4a58; }
  button:disabled { opacity:.4; cursor:default; }
  button.an { background:var(--an); border-color:var(--an); color:#fff; }
  button.rot { background:#b3211f; border-color:#b3211f; color:#fff; }
  button.klein { font-size:.8rem; padding:.28rem .7rem; }
  #sprechen { flex:1; min-width:10rem; font-weight:600; font-size:.9rem; }
  #mikro, #aufnahme { flex:1; min-width:9rem; font-size:.9rem; }

  #pegel { height:.4rem; background:#1c1c24; border-radius:.25rem; overflow:hidden;
           margin:.2rem 0 .5rem; flex:none; }
  #pegelbalken { height:100%; width:0; background:var(--an); transition:width .05s; }

  #marken { display:flex; gap:.5rem; flex-wrap:wrap; margin:.3rem 0; flex:none; }
  .marke { display:none; align-items:center; gap:.5rem; padding:.35rem .7rem;
           border-radius:2rem; font-size:.82rem; font-weight:600; }
  .marke.an { display:inline-flex; }
  #m-gespraech { background:#14351f; color:#7ddc9a; border:1px solid #2c6b40; }
  #m-transkript { background:#12283a; color:#7ab8e8; border:1px solid #1a4a6b; }
  #m-recherche { background:#3a2a12; color:#e8b339; border:1px solid #6b4c1a; }
  .puls { width:.5em; height:.5em; border-radius:50%; background:currentColor;
          animation:blink 1.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  #m-recherche .frage { font-weight:400; opacity:.8; max-width:11rem;
                        overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* Laufende Timer: gehoeren nach oben, nicht in den Verlauf -- sie sind ein
     Zustand, keine Aeusserung. */
  #wecker { display:none; flex-direction:column; gap:.3rem; margin:.4rem 0 0;
            flex:none; }
  #wecker.an { display:flex; }
  .weckzeile { display:flex; align-items:baseline; gap:.6rem; font-size:.85rem;
               padding:.35rem .6rem; border-radius:.35rem; background:#191922;
               border:1px solid #2f2a1a; }
  .weckzeile .rest { color:#e8b339; font-weight:600; font-variant-numeric:tabular-nums;
                     flex:none; }
  .weckzeile .wofuer { color:var(--matt); overflow:hidden;
                       text-overflow:ellipsis; white-space:nowrap; }
  .weckzeile.bald .rest { animation:blink 1.4s ease-in-out infinite; }

  /* Der Verlauf nimmt den Rest der Spalte und scrollt fuer sich. */
  #verlauf { flex:1; min-height:0; overflow-y:auto; border-top:1px solid var(--linie);
             margin-top:.6rem; padding:.8rem 0; }
  /* Ohne Hinweis ist die leere Spalte nur ein Loch. */
  #verlauf:empty::before { content:"Noch nichts gesprochen."; color:var(--matt);
                           font-size:.85rem; }
  .zeile { margin-bottom:.7rem; }
  .wer { color:var(--matt); font-size:.72rem; text-transform:uppercase;
         letter-spacing:.08em; }
  .zeile.assistent .wer { color:#7aa2d8; }
  .zeile .text { white-space:pre-wrap; overflow-wrap:anywhere; }
  /* Zeigt an, dass etwas auf der Buehne gelandet ist, und holt es zurueck. */
  #b-inhalt hr { border:none; border-top:1px solid var(--linie); margin:1rem 0; }
  #b-inhalt table { border-collapse:collapse; margin:.8rem 0; font-size:.88rem;
                    display:block; overflow-x:auto; max-width:100%; }
  #b-inhalt th, #b-inhalt td { border:1px solid var(--linie); padding:.32rem .6rem;
                               text-align:left; vertical-align:top; }
  #b-inhalt th { background:#1a1a22; font-weight:600; color:var(--fg);
                 white-space:nowrap; }
  /* Zahlenspalten rechtsbuendig lesen sich besser -- aber nur, wenn die Zelle
     wirklich eine Zahl ist. Per CSS nicht zu unterscheiden, also bleibt es
     linksbuendig; eine falsche Ausrichtung waere schlimmer als eine
     langweilige. */
  #b-inhalt tbody tr:nth-child(even) { background:#15151c; }

  /* Anzeigetafel. Ein Gitter, das sich nach der Breite richtet -- eine
     einzelne Groesse darf die Flaeche fuellen, vier teilen sie sich. */
  #b-inhalt .tafel { display:grid; gap:1rem; grid-template-columns:repeat(auto-fit,minmax(15rem,1fr)); }
  .instrument { background:var(--karte); border:1px solid var(--linie);
                border-radius:8px; padding:.9rem 1rem; }
  .instrument .titel { font-size:.8rem; color:var(--matt); margin-bottom:.5rem; }
  .instrument .zahl { font-size:2.1rem; font-weight:600; line-height:1.1;
                      font-variant-numeric:tabular-nums; }
  .instrument .einheit { font-size:.9rem; font-weight:400; color:var(--matt);
                         margin-left:.25rem; }
  .instrument .von { font-size:.78rem; color:var(--matt); margin-top:.2rem; }
  .balken { height:.7rem; background:#15151c; border-radius:4px; overflow:hidden;
            margin-top:.55rem; }
  .balken i { display:block; height:100%; background:var(--an);
              transition:width .4s ease, background .4s ease; }
  .warn i, .warn .zahl { color:var(--gelb); }
  .warn i { background:var(--gelb); }
  .krit i, .krit .zahl { color:var(--rot); }
  .krit i { background:var(--rot); }
  .instrument svg { display:block; margin:.3rem auto 0; }

  .merker { display:flex; align-items:center; gap:.5rem; margin-bottom:.7rem;
            padding:.4rem .6rem; border-radius:.35rem; cursor:pointer;
            border:1px solid var(--linie); background:#15151c; font-size:.85rem;
            color:#e8b339; }
  .merker:hover { border-color:#6b4c1a; background:#1a1a22; }
  .merker .pfeil { flex:none; opacity:.7; }
  /* Zwei Zeilen reichen als Verweis -- die Frage steht vollstaendig oben auf
     der Buehne. */
  .merker span:not(.pfeil) { display:-webkit-box; -webkit-line-clamp:2;
                             -webkit-box-orient:vertical; overflow:hidden; }

  /* Texteingabe: zweiter, gleichwertiger Weg neben der Stimme. Am Client
     kann eine Tastatur haengen, und im Labor ist es laut. Sie sitzt unter dem
     Verlauf und ueber den Leuchten -- dort, wo man beim Lesen ohnehin
     hinschaut, und ohne der Buehne Platz zu nehmen. */
  #tippen { display:flex; gap:.5rem; flex:none; padding:.7rem 0 .5rem; }
  #tippen input { flex:1; min-width:0; background:var(--karte); color:var(--fg);
                  border:1px solid var(--linie); border-radius:6px;
                  padding:.5rem .7rem; font:inherit; font-size:.9rem; }
  #tippen input:focus { outline:none; border-color:#6b4c1a; }
  #tippen button { flex:none; }
  #leds { display:flex; gap:1rem; font-size:.78rem; color:var(--matt); flex:none;
          border-top:1px solid var(--linie); padding:.6rem 0; flex-wrap:wrap; }
  .led { display:inline-block; width:.55em; height:.55em; border-radius:50%;
         background:#6b2020; margin-right:.35em; }
  .led.da { background:var(--an); }
  #warnung { background:#3a2a12; border:1px solid #6b4c1a; color:#e8b339;
             padding:.7rem .9rem; border-radius:.4rem; margin-bottom:.8rem;
             display:none; font-size:.85rem; flex:none; }
  kbd { background:#1c1c24; border:1px solid var(--linie); border-radius:.25rem;
        padding:.1em .4em; font-size:.85em; }
  #anleitung { font-size:.8rem; margin:.4rem 0 .2rem; flex:none; }

  /* --- Buehne -------------------------------------------------------------- */
  #b-kopf { display:flex; align-items:center; gap:.8rem; flex:none;
            border-bottom:1px solid var(--linie); padding:1rem 1.6rem; }
  #b-titel { font-size:1rem; font-weight:600; overflow:hidden;
             text-overflow:ellipsis; white-space:nowrap; }
  #b-art { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em;
           padding:.15rem .5rem; border-radius:1rem; flex:none; }
  #b-wann { color:var(--matt); font-size:.8rem; flex:none; margin-left:auto;
            white-space:nowrap; }
  #b-knoepfe { display:flex; gap:.5rem; flex:none; }
  .art-protokoll { background:#12283a; color:#7ab8e8; }
  .art-recherche { background:#3a2a12; color:#e8b339; }
  .art-hilfe     { background:#14351f; color:#7ddc9a; }
  .art-erinnerungen { background:#3a2a12; color:#e8b339; }
  .art-ablage    { background:#22222c; color:var(--matt); }
  .art-anzeige   { background:#12301f; color:#7fd39b; }

  #b-inhalt { flex:1; min-height:0; overflow-y:auto; padding:1.4rem 1.6rem 3rem;
              font-size:.92rem; line-height:1.65; }
  #b-inhalt h1,#b-inhalt h2,#b-inhalt h3 { font-weight:600; margin:1.4rem 0 .5rem;
                                           line-height:1.3; }
  #b-inhalt h1 { font-size:1.25rem; } #b-inhalt h2 { font-size:1.1rem; }
  #b-inhalt h3 { font-size:1rem; color:#b8b8c4; }
  #b-inhalt h1:first-child,#b-inhalt h2:first-child { margin-top:0; }
  #b-inhalt blockquote { border-left:3px solid #6b4c1a; color:#c9a961;
                         padding-left:.9rem; margin:.7rem 0; font-size:.9rem; }
  #b-inhalt code { background:#1c1c24; padding:.1em .35em; border-radius:.2rem;
                   font-size:.9em; }
  #b-inhalt .zeit { color:#7ab8e8; font-weight:600; }
  /* Lange Ergebnisse sind angenehmer in begrenzter Zeilenlaenge zu lesen,
     die Flaeche darf trotzdem breit sein. */
  #b-inhalt .lauf { max-width:52rem; }

  .eintrag { display:flex; align-items:center; gap:.7rem; padding:.55rem .6rem;
             border-radius:.35rem; cursor:pointer; border:1px solid transparent;
             max-width:52rem; }
  .eintrag:hover { background:#1a1a22; border-color:var(--linie); }
  .eintrag .art { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em;
                  padding:.15rem .5rem; border-radius:1rem; flex:none; }
  .art.protokoll { background:#12283a; color:#7ab8e8; }
  .art.recherche { background:#3a2a12; color:#e8b339; }
  .eintrag .wann { color:var(--matt); font-size:.8rem; flex:none; }
  .eintrag .titel { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .b-leer { color:var(--matt); font-size:.9rem; }
</style>

<div id="seite">
  <div id="kopf">
    <div><h1>kihiwi</h1><span class="matt" id="geraet">kein Mikrofon gewählt</span></div>
    <div id="phase" class="matt">—</div>
  </div>

  <div id="warnung"></div>

  <div class="knoepfe">
    <button id="mikro">Mikrofon einschalten</button>
    <button id="aufnahme" disabled>Aufzeichnung starten</button>
  </div>
  <div id="pegel"><div id="pegelbalken"></div></div>
  <div class="knoepfe">
    <button id="sprechen" disabled>Ansprechen <kbd>Leertaste</kbd></button>
    <button id="abbrechen" disabled>Abbrechen</button>
    <button id="tonprobe" class="klein">Tonprobe</button>
  </div>

  <p class="matt" id="anleitung">
    Sag <b>„Kiwi“</b> und dann die Anweisung. Danach bleibt das Gespräch offen,
    bis <b>„Danke, Kiwi“</b> kommt oder 45 s nichts. Sag <b>„Kiwihilfe“</b> für
    alle Auslösewörter.</p>

  <div id="marken">
    <span class="marke" id="m-gespraech"><span class="puls"></span>Im Gespräch</span>
    <span class="marke" id="m-transkript"><span class="puls"></span>Protokoll läuft</span>
    <span class="marke" id="m-recherche"><span class="puls"></span>Recherche
      <span id="m-rzeit"></span><span class="frage" id="m-rfrage"></span></span>
  </div>

  <div id="wecker"></div>

  <div id="verlauf"></div>

  <form id="tippen" autocomplete="off">
    <input id="tipp-feld" type="text" placeholder="… oder tippen (ohne „Kiwi“)"
           aria-label="Anweisung tippen" maxlength="2000">
    <button type="submit" class="klein">senden</button>
    <button type="button" class="klein" id="vorlesen"
            title="Antworten laut vorlesen">🔊</button>
  </form>

  <div id="leds">
    <span><span class="led" id="led-ws"></span>Verbindung</span>
    <span><span class="led" id="led-stt"></span>Erkennung</span>
    <span><span class="led" id="led-llm"></span>Modell</span>
    <span><span class="led" id="led-ton"></span><span id="ton-status">—</span></span>
  </div>
</div>

<div id="buehne">
  <div id="b-kopf">
    <span id="b-art" class="art-ablage">Ablage</span>
    <span id="b-titel">Protokolle und Recherchen</span>
    <span id="b-wann"></span>
    <span id="b-knoepfe">
      <button id="b-zurueck" class="klein" style="display:none">← Ablage</button>
      <button id="b-neuladen" class="klein">neu laden</button>
    </span>
  </div>
  <div id="b-inhalt"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const RATE = 16000, BLOCK = 512;
let ws, ctx, quelle, knoten, strom, spielt = 0, tonRate = 22050, rSeit = 0;
let warAn = false;   // lief der AudioContext beim letzten Puffer?
let warBeschaeftigt = false;

// Laufende Zeit der Recherche: sie dauert Minuten, und ohne Uhr wirkt jeder
// Zwischenstand wie ein Hänger.
setInterval(() => {
  if (!rSeit) { $("m-rzeit").textContent = ""; return; }
  const s = Math.max(0, Math.round(Date.now()/1000 - rSeit));
  $("m-rzeit").textContent = `(${Math.floor(s/60)}:${String(s%60).padStart(2,"0")})`;
}, 1000);

// Laufende Erinnerungen. Der Dienst schickt absolute Zeitpunkte, der Zaehler
// laeuft hier — sonst muesste im Sekundentakt gefunkt werden.
let weckliste = [];

function weckText(sek) {
  sek = Math.max(0, Math.round(sek));
  const h = Math.floor(sek/3600), m = Math.floor(sek%3600/60), s = sek%60;
  return h ? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`
           : `${m}:${String(s).padStart(2,"0")}`;
}

function weckZeichnen() {
  const w = $("wecker");
  w.classList.toggle("an", weckliste.length > 0);
  if (!weckliste.length) { w.innerHTML = ""; return; }
  const jetzt = Date.now()/1000;
  w.innerHTML = "";
  for (const e of weckliste) {
    const rest = e.faellig - jetzt;
    const d = document.createElement("div");
    d.className = "weckzeile" + (rest < 60 ? " bald" : "");
    const r = document.createElement("span");
    r.className = "rest"; r.textContent = weckText(rest);
    const t = document.createElement("span");
    t.className = "wofuer";
    t.textContent = e.text || "Timer";
    d.append(r, t);
    w.appendChild(d);
  }
}
setInterval(weckZeichnen, 1000);

// Gong vor der Ansage: im Labor ist ein Ton schneller verstanden als ein Satz,
// und er kommt auch an, wenn gerade jemand redet.
function gong() {
  if (!ctx) return;
  if (ctx.state === "suspended") ctx.resume();
  const t0 = ctx.currentTime + 0.02;
  [880, 1174.7].forEach((hz, i) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.value = hz;
    const start = t0 + i * 0.18;
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(0.22, start + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, start + 0.5);
    o.connect(g); g.connect(ctx.destination);
    o.start(start); o.stop(start + 0.55);
  });
}

function warnen(t) { $("warnung").textContent = t; $("warnung").style.display = "block"; }

if (!window.isSecureContext) {
  warnen("Kein sicherer Kontext — der Browser gibt das Mikrofon nicht frei. "
       + "Über SSH weiterleiten und http://localhost:8920/klient aufrufen: "
       + "ssh -L 8920:127.0.0.1:8920 <rechner>");
}

// --- Aufnahme: 512er-Bloecke als int16, genau das Format des Dienstes ---------
const WORKLET = `
class Sender extends AudioWorkletProcessor {
  constructor() { super(); this.puffer = new Float32Array(${BLOCK}); this.n = 0; }
  process(eingang) {
    const k = eingang[0][0];
    if (!k) return true;
    for (let i = 0; i < k.length; i++) {
      this.puffer[this.n++] = k[i];
      if (this.n === ${BLOCK}) {
        const aus = new Int16Array(${BLOCK});
        let spitze = 0;
        for (let j = 0; j < ${BLOCK}; j++) {
          const v = Math.max(-1, Math.min(1, this.puffer[j]));
          aus[j] = v * 32767;
          if (Math.abs(v) > spitze) spitze = Math.abs(v);
        }
        this.port.postMessage({pcm: aus.buffer, spitze}, [aus.buffer]);
        this.n = 0;
      }
    }
    return true;
  }
}
registerProcessor('sender', Sender);
`;

async function mikroAn() {
  // sampleRate direkt auf 16 kHz: der Browser resampelt selbst, wir muessen nicht.
  ctx = new AudioContext({sampleRate: RATE});
  strom = await navigator.mediaDevices.getUserMedia({audio: {
    channelCount: 1,
    // Das Jabra hat eigene Echounterdrueckung. Die des Browsers bleibt an --
    // sie stoert nicht und hilft, falls doch ein anderes Mikrofon dranhaengt.
    echoCancellation: true, noiseSuppression: true, autoGainControl: true}});
  const spur = strom.getAudioTracks()[0];
  $("geraet").textContent = spur.label || "Mikrofon aktiv";

  await ctx.audioWorklet.addModule(URL.createObjectURL(
    new Blob([WORKLET], {type: "application/javascript"})));
  spielt = 0; warAn = false;
  quelle = ctx.createMediaStreamSource(strom);
  knoten = new AudioWorkletNode(ctx, "sender");
  knoten.port.onmessage = e => {
    $("pegelbalken").style.width = Math.min(100, e.data.spitze * 140) + "%";
    if (ws && ws.readyState === 1) ws.send(e.data.pcm);
  };
  quelle.connect(knoten);
}

function mikroAus() {
  if (quelle) quelle.disconnect();
  if (strom) strom.getTracks().forEach(t => t.stop());
  if (ctx) ctx.close();
  quelle = knoten = strom = ctx = null;
  $("pegelbalken").style.width = "0";
  $("geraet").textContent = "kein Mikrofon gewählt";
}

// --- Wiedergabe: int16-PCM in der Rate, die der Dienst ankuendigt -------------
function abspielen(puffer) {
  if (!ctx) return;
  // Browser halten den AudioContext an (Tab im Hintergrund, Energiesparen).
  // Dann wird zwar alles terminiert, aber nichts ist hörbar — der Text kommt,
  // der Ton nicht. Ohne resume() ist das von aussen nicht zu unterscheiden.
  if (ctx.state === "suspended") { ctx.resume(); warAn = false; }

  const roh = new Int16Array(puffer);
  const b = ctx.createBuffer(1, roh.length, tonRate);
  const k = b.getChannelData(0);
  for (let i = 0; i < roh.length; i++) k[i] = roh[i] / 32768;
  const q = ctx.createBufferSource();
  q.buffer = b; q.connect(ctx.destination);

  const jetzt = ctx.currentTime;
  // Zurücksetzen NUR, wenn die Warteschlange leergelaufen ist oder der Context
  // angehalten war. Ein voller Puffer ist normal: die TTS-Stücke kommen 25x
  // schneller als Echtzeit, eine lange Antwort läuft zu Recht zehn Sekunden
  // voraus. Eine Grenze von 8 s hielt das für einen Hänger, setzte zurück —
  // und der Rest spielte ÜBER dem schon Terminierten. Zwei Stimmen zugleich.
  if (spielt < jetzt || !warAn) { spielt = jetzt + 0.02; warAn = true; }
  q.start(spielt);
  spielt += b.duration;
  tonZustand();
}

function tonZustand() {
  if (!ctx) { $("ton-status").textContent = "—"; return; }
  const vor = Math.max(0, spielt - ctx.currentTime);
  $("ton-status").textContent = ctx.state === "running"
    ? (vor > 0.1 ? `Ton (${vor.toFixed(1)}s)` : "Ton bereit")
    : ctx.state;
  $("led-ton").classList.toggle("da", ctx.state === "running");
}

// --- Verlauf -----------------------------------------------------------------
const TEXTE = {leerlauf:"Mikrofon aus", bereit:"Bereit", hoeren:"Hört zu",
               denken:"Denkt nach", antworten:"Antwortet"};

// Nach unten anhaengen, nicht nach oben: der Verlauf wurde mit prepend
// aufgebaut und las sich rueckwaerts -- die Antwort stand ueber der Frage.
function amEnde(el) {
  const v = $("verlauf");
  const unten = v.scrollHeight - v.scrollTop - v.clientHeight < 60;
  v.appendChild(el);
  if (unten) v.scrollTop = v.scrollHeight;
}

function zeile(wer, text) {
  const d = document.createElement("div");
  d.className = "zeile " + wer;
  d.innerHTML = `<div class="wer">${wer === "nutzer" ? "Du" : "Assistent"}</div>`;
  const p = document.createElement("div");
  p.className = "text";
  p.textContent = text;
  d.appendChild(p);
  amEnde(d);
}

/* Verweis im Verlauf auf etwas, das auf der Buehne liegt. Der Verlauf bleibt
   damit lesbar, und das Ausfuehrliche ist trotzdem einen Klick entfernt. */
function merker(text, zeigen) {
  const d = document.createElement("div");
  d.className = "merker";
  d.innerHTML = '<span class="pfeil">→</span>';
  const s = document.createElement("span");
  s.textContent = text;
  d.appendChild(s);
  d.onclick = zeigen;
  amEnde(d);
}

/* --- Anzeigetafel -----------------------------------------------------------
   Die Werte kommen ueber /api/messwerte, nicht ueber den WebSocket: die
   Anzeige lebt im Browser, und der Dienst muss nicht wissen, wer gerade was
   eingeblendet hat. Ein Zeitgeber je Tafel, der beim naechsten buehne()
   abgeraeumt wird -- sonst laufen nach drei Recherchen drei Abfragen weiter. */
let tafelUhr = null;
const verlauf = {};          // je Groesse die letzten Messwerte fuers Diagramm
const VERLAUF_MAX = 60;

function stufe(w) {
  if (w.kritisch != null && w.zahl >= w.kritisch) return "krit";
  if (w.warn != null && w.zahl >= w.warn) return "warn";
  return "";
}

function zeigerSvg(anteil, farbe) {
  // Halbrund von -90 bis +90 Grad. Kein <canvas>: SVG skaliert mit und
  // braucht keine Neuzeichnung bei Groessenaenderung.
  const r = 52, mx = 70, my = 62;
  const bogen = (von, bis) => {
    const p = a => [mx + r * Math.cos(a), my + r * Math.sin(a)];
    const [x1, y1] = p(von), [x2, y2] = p(bis);
    return `M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`;
  };
  const a0 = Math.PI, a1 = Math.PI + Math.PI * Math.max(0, Math.min(1, anteil));
  const zg = a1, zx = mx + (r - 9) * Math.cos(zg), zy = my + (r - 9) * Math.sin(zg);
  return `<svg width="140" height="72" viewBox="0 0 140 72">
    <path d="${bogen(a0, 2 * Math.PI)}" fill="none" stroke="#2a2a33" stroke-width="9"/>
    ${anteil > 0.001 ? `<path d="${bogen(a0, a1)}" fill="none" stroke="${farbe}" stroke-width="9" stroke-linecap="round"/>` : ""}
    <line x1="${mx}" y1="${my}" x2="${zx.toFixed(1)}" y2="${zy.toFixed(1)}"
          stroke="${farbe}" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="${mx}" cy="${my}" r="3.5" fill="${farbe}"/>
  </svg>`;
}

function verlaufSvg(reihe, max, farbe) {
  if (reihe.length < 2) return '<div class="von">sammelt Werte …</div>';
  const b = 260, h = 64;
  // Die vorhandenen Punkte ueber die volle Breite, nicht auf einer festen
  // 60-Sekunden-Achse: sechs Messwerte in der linken Ecke sehen aus wie ein
  // Defekt. Die Beschriftung sagt, welchen Zeitraum man sieht -- damit ist
  // die gestauchte Achse kein Betrug, sondern eine wachsende Aufloesung.
  const n = reihe.length;
  const pkt = reihe.map((v, i) => {
    const x = n > 1 ? (i / (n - 1)) * b : 0;
    const y = h - (max ? Math.max(0, Math.min(1, v / max)) : 0) * (h - 4) - 2;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const hoch = Math.max(...reihe), tief = Math.min(...reihe);
  return `<svg width="100%" height="${h}" viewBox="0 0 ${b} ${h}" preserveAspectRatio="none">
    <polyline points="${pkt}" fill="none" stroke="${farbe}" stroke-width="2"
              vector-effect="non-scaling-stroke"/>
  </svg>
  <div class="von">letzte ${n} s &middot; ${tief} bis ${hoch}</div>`;
}

function instrument(w, art) {
  const kl = stufe(w);
  const farbe = kl === "krit" ? "#c0453b" : kl === "warn" ? "#c9a227" : "#3d9a54";
  const anteil = w.max ? w.zahl / w.max : 0;
  const zahl = `<div class="zahl">${w.zahl}<span class="einheit">${w.einheit}</span></div>`;
  let koerper;
  if (art === "zeiger") {
    koerper = zahl + zeigerSvg(anteil, farbe);
  } else if (art === "diagramm") {
    koerper = zahl + verlaufSvg(verlauf[w.name] || [], w.max, farbe);
  } else if (art === "zahl") {
    koerper = zahl + `<div class="von">von ${w.max} ${w.einheit}</div>`;
  } else {
    koerper = zahl + `<div class="balken"><i style="width:${(anteil * 100).toFixed(1)}%"></i></div>`
            + `<div class="von">von ${w.max} ${w.einheit}</div>`;
  }
  return `<div class="instrument ${kl}"><div class="titel">${w.name}</div>${koerper}</div>`;
}

async function tafelZeichnen(groessen, art) {
  let werte;
  try {
    werte = await (await fetch("/api/messwerte")).json();
  } catch (e) {
    $("b-inhalt").innerHTML = '<div class="b-leer">Messwerte nicht erreichbar.</div>';
    return;
  }
  for (const g of groessen) {
    const w = werte[g];
    if (!w) continue;
    (verlauf[w.name] = verlauf[w.name] || []).push(w.zahl);
    if (verlauf[w.name].length > VERLAUF_MAX) verlauf[w.name].shift();
  }
  $("b-inhalt").innerHTML = '<div class="lauf"><div class="tafel">'
    + groessen.filter(g => werte[g]).map(g => instrument(werte[g], art)).join("")
    + "</div></div>";
}

/* Der Dienst schickt den letzten Buehnenstand beim Verbinden mit "wieder" nach.
   Ohne den Vermerk sieht ein Ergebnis von vorhin aus wie ein frisches -- und
   ohne die Wiederherstellung sah es aus, als haette es das Ergebnis nie
   gegeben, was nach einer Recherche genau so gemeldet wurde. Ein Merker im
   Verlauf entfaellt dabei: der Verlauf ist nach dem Neuladen selbst leer, und
   ein einzelner Verweis darin waere irrefuehrend. */
function wannZusatz(d, wann) {
  if (!d.wieder) return wann || "";
  return wann ? wann + " · von vorhin" : "von vorhin";
}

// --- Buehne ------------------------------------------------------------------
/* Steht schon etwas auf der Buehne? Beim Seitenstart laufen zwei Dinge
   gleichzeitig: `ablageLaden()` holt die Liste per fetch, und der Dienst
   schickt beim Verbinden den letzten Buehnenstand nach. Wessen Antwort zuerst
   da ist, entscheidet -- im Test stand der Kopf "Ablage" ueber den
   Messinstrumenten. Die wiederhergestellte Buehne hat Vorrang: sie ist das,
   womit der Nutzer zuletzt gearbeitet hat. */
let buehneBelegt = false;

function buehne(art, titel, html, wann) {
  // Laufende Tafel-Abfrage beenden: sonst fragt sie im Sekundentakt weiter,
  // obwohl laengst ein Protokoll auf der Buehne steht.
  if (tafelUhr) { clearInterval(tafelUhr); tafelUhr = null; }
  if (art !== "Ablage") buehneBelegt = true;
  $("b-art").textContent = art;
  $("b-art").className = "art-" + (["protokoll","recherche","hilfe","erinnerungen","anzeige"]
                                   .includes(art.toLowerCase()) ? art.toLowerCase()
                                                                : "ablage");
  $("b-titel").textContent = titel;
  $("b-wann").textContent = wann || "";
  $("b-inhalt").innerHTML = `<div class="lauf">${html}</div>`;
  $("b-inhalt").scrollTop = 0;
  $("b-zurueck").style.display = art === "Ablage" ? "none" : "";
}

function verbinden() {
  ws = new WebSocket(`ws://${location.host}/audio`);
  ws.binaryType = "arraybuffer";
  ws.onopen  = () => {
    $("led-ws").classList.add("da");
    // Beim Verbinden neu schicken: der Dienst kennt die Einstellung nicht,
    // sie lebt im Browser und muss jeden Neustart ueberdauern.
    senden({befehl: "vorlesen", an: vorlesen});
  };
  ws.onclose = () => { $("led-ws").classList.remove("da"); setTimeout(verbinden, 1500); };
  ws.onmessage = e => {
    if (e.data instanceof ArrayBuffer) { abspielen(e.data); return; }
    const d = JSON.parse(e.data);
    if (d.typ === "zustand") {
      $("phase").textContent = TEXTE[d.phase] || d.phase;
      // Gespräch und Recherche sind unabhängig voneinander und werden deshalb
      // als eigene Marken angezeigt, nicht in der Phase — sonst verdeckt eines
      // das andere.
      $("m-gespraech").classList.toggle("an", !!d.gespraech);
      $("m-recherche").classList.toggle("an", !!d.recherche);
      $("m-transkript").classList.toggle("an", !!d.transkription);
      /* Nach dem Ende einer Nachbereitung oder Recherche gibt es Neues. */
      const beschaeftigt = !!d.transkription || !!d.recherche;
      if (warBeschaeftigt && !beschaeftigt) ablageLaden(false);
      warBeschaeftigt = beschaeftigt;
      $("m-rfrage").textContent = d.recherche || "";
      rSeit = d.recherche_seit || 0;
      $("phase").className = d.phase === "leerlauf" ? "matt" : "";
      $("aufnahme").classList.toggle("rot", d.aufnahme);
      $("aufnahme").textContent = d.aufnahme ? "Aufzeichnung läuft — stoppen"
                                             : "Aufzeichnung starten";
      $("led-stt").classList.toggle("da", d.stt_da);
      $("led-llm").classList.toggle("da", d.llm_da);
      weckliste = d.wecker || [];
      weckZeichnen();
    } else if (d.typ === "wecker_gong") {
      gong();
    } else if (d.typ === "wecker_liste") {
      const zeigen = () => buehne("Erinnerungen", "Laufende Erinnerungen",
                                  alsHtml(d.text), wannZusatz(d));
      zeigen();
    } else if (d.typ === "text") {
      zeile(d.rolle, d.text);
    } else if (d.typ === "hilfe") {
      const zeigen = () => buehne("Hilfe", "Was Kiwi versteht", alsHtml(d.text),
                                  wannZusatz(d));
      zeigen();
      if (!d.wieder) merker("Hilfe", zeigen);
    } else if (d.typ === "protokoll") {
      // Nicht mehr in den Verlauf: ein volles Protokoll schob dort alles
      // andere aus dem Bild. Gesprochen wird die Zusammenfassung, hier liegt
      // das Ganze.
      const zeigen = () => buehne("Protokoll", `Protokoll ${d.sitzung}`,
                                  alsHtml(d.text), wannZusatz(d));
      zeigen();
      if (!d.wieder) merker(`Protokoll ${d.sitzung}`, zeigen);
    } else if (d.typ === "recherche") {
      const zeigen = () => buehne("Recherche", d.frage, alsHtml(d.text),
                                  wannZusatz(d, `${d.dauer}s`));
      zeigen();
      if (!d.wieder) merker(`Rechercheergebnis: ${d.frage}`, zeigen);
    } else if (d.typ === "anzeige") {
      const zeigen = () => {
        buehne("Anzeige", "Messwerte", "", wannZusatz(d));
        tafelZeichnen(d.groessen, d.darstellung);
        tafelUhr = setInterval(() => tafelZeichnen(d.groessen, d.darstellung), 1000);
      };
      zeigen();
      if (!d.wieder) merker("Anzeigetafel", zeigen);
    } else if (d.typ === "ton") {
      tonRate = d.rate;
    }
  };
}

const senden = o => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));

/* Getippt ist gleichwertig zu gesprochen: derselbe Weg im Dienst, dieselbe
   Antwort, dieselbe Buehne. Der Dienst braucht dafuer kein Mikrofon -- das
   Feld bleibt also auch bedienbar, wenn die Aufnahme aus ist. */
$("tippen").addEventListener("submit", e => {
  e.preventDefault();
  const f = $("tipp-feld"), t = f.value.trim();
  if (!t) return;
  senden({befehl: "text", text: t});
  f.value = "";
});

/* Vorlesen abschalten. Der Dienst hoert auf, Ton zu erzeugen -- nicht der
   Klient hoert auf, ihn abzuspielen: sonst liefe Piper weiter fuer nichts.
   Die Einstellung liegt im Browser, weil sie zum Arbeitsplatz gehoert und
   nicht zum Dienst, und wird bei jedem Verbinden neu geschickt. */
let vorlesen = true;
try { vorlesen = localStorage.getItem("vorlesen") !== "aus"; } catch (e) {}
function vorlesenZeichnen() {
  const b = $("vorlesen");
  b.textContent = vorlesen ? "🔊" : "🔇";
  b.title = vorlesen ? "Antworten werden vorgelesen — klicken für stumm"
                     : "stumm — klicken zum Vorlesen";
  b.style.opacity = vorlesen ? "" : ".55";
}
$("vorlesen").onclick = () => {
  vorlesen = !vorlesen;
  try { localStorage.setItem("vorlesen", vorlesen ? "an" : "aus"); } catch (e) {}
  vorlesenZeichnen();
  senden({befehl: "vorlesen", an: vorlesen});
};
vorlesenZeichnen();

$("mikro").onclick = async () => {
  if (ctx) {
    mikroAus(); senden({befehl: "mikro", an: false});
    $("mikro").textContent = "Mikrofon einschalten"; $("mikro").classList.remove("an");
    $("aufnahme").disabled = $("sprechen").disabled = $("abbrechen").disabled = true;
  } else {
    try { await mikroAn(); } catch (e) { warnen("Mikrofon nicht verfügbar: " + e.message); return; }
    senden({befehl: "mikro", an: true});
    $("mikro").textContent = "Mikrofon ausschalten"; $("mikro").classList.add("an");
    $("aufnahme").disabled = $("sprechen").disabled = $("abbrechen").disabled = false;
  }
};
$("aufnahme").onclick = () =>
  senden({befehl: "aufnahme", an: !$("aufnahme").classList.contains("rot")});
$("abbrechen").onclick = () => senden({befehl: "abbrechen"});

// Tonprobe: trennt "Dienst sendet nichts" von "Browser gibt nichts aus".
$("tonprobe").onclick = async () => {
  if (!ctx) { warnen("Erst das Mikrofon einschalten — dann gibt es einen AudioContext."); return; }
  if (ctx.state === "suspended") await ctx.resume();
  const dauer = 0.4, n = Math.floor(ctx.sampleRate * dauer);
  const b = ctx.createBuffer(1, n, ctx.sampleRate), k = b.getChannelData(0);
  for (let i = 0; i < n; i++) k[i] = Math.sin(2*Math.PI*440*i/ctx.sampleRate) * 0.25
                                     * Math.min(1, (n-i)/(0.05*ctx.sampleRate));
  const q = ctx.createBufferSource(); q.buffer = b; q.connect(ctx.destination); q.start();
  tonZustand();
};
setInterval(tonZustand, 1000);

// Ansprechen ersetzt das Aktivierungswort, solange es keins gibt.
const ansprechen = () => { if (!$("sprechen").disabled) senden({befehl: "ansprechen"}); };
$("sprechen").onclick = ansprechen;
addEventListener("keydown", e => {
  if (e.code === "Space" && !e.repeat && e.target === document.body) {
    e.preventDefault(); ansprechen();
  }
});

function wannText(sek) {
  const d = new Date(sek * 1000), heute = new Date();
  const zeit = d.toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit"});
  return d.toDateString() === heute.toDateString()
    ? `heute ${zeit}` : `${d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})} ${zeit}`;
}

/* Sehr kleiner Markdown-Umsetzer: nur was in unseren Dateien vorkommt. */
/* Markdown-Tabellen. Der Rechercheagent antwortet auf Maßfragen mit Tabellen
   ("| Maß | Wert | Quelle |"), und ungerendert stand da eine Wand aus
   Pipe-Zeichen. Zeilenweise statt mit einem Regex ueber den ganzen Text:
   Tabellen sind mehrzeilig, und ein gieriger Ausdruck verschluckt den Absatz
   dahinter. Die Bloecke werden durch Platzhalter ersetzt, damit die
   Zeilenumbrueche weiter unten sie nicht zerreissen. */
function tabellen(text, ablage) {
  const zeilen = text.split("\n");
  const aus = [];
  for (let i = 0; i < zeilen.length; i++) {
    const kopf = zeilen[i], trenn = zeilen[i + 1] || "";
    // Kopfzeile plus Trennzeile (|---|---|) -- sonst ist es keine Tabelle,
    // sondern eine Zeile, die zufaellig ein Pipe-Zeichen enthaelt.
    if (!/^\s*\|.*\|\s*$/.test(kopf) || !/^\s*\|[\s:|-]+\|\s*$/.test(trenn)) {
      aus.push(kopf);
      continue;
    }
    const zelle = z => z.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|")
                        .map(c => c.trim());
    const kopfz = zelle(kopf);
    const koerper = [];
    let j = i + 2;
    while (j < zeilen.length && /^\s*\|.*\|\s*$/.test(zeilen[j])) {
      koerper.push(zelle(zeilen[j])); j++;
    }
    const inline = t => t.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
                         .replace(/`(.+?)`/g, "<code>$1</code>");
    const html = "<table><thead><tr>"
      + kopfz.map(c => `<th>${inline(c)}</th>`).join("")
      + "</tr></thead><tbody>"
      + koerper.map(r => "<tr>" + r.map(c => `<td>${inline(c)}</td>`).join("") + "</tr>").join("")
      + "</tbody></table>";
    aus.push(`\u0000T${ablage.push(html) - 1}\u0000`);
    i = j - 1;
  }
  return aus.join("\n");
}

function alsHtml(md) {
  const esc = t => t.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const ablage = [];
  return tabellen(esc(md), ablage)
    .replace(/^### (.*)$/gm, "<h3>$1</h3>")
    .replace(/^## (.*)$/gm, "<h2>$1</h2>")
    .replace(/^# (.*)$/gm, "<h1>$1</h1>")
    // Trennlinien: --- oder *** auf eigener Zeile. Standen vorher als
    // Zeichenfolge im Text.
    .replace(/^ {0,3}(?:-{3,}|\*{3,}|_{3,})\s*$/gm, "<hr>")
    .replace(/^&gt; ?(.*)$/gm, "<blockquote>$1</blockquote>")
    // Aufeinanderfolgende Zitatzeilen zu EINEM Block: ein mehrzeiliges Zitat
    // wurde sonst in ebenso viele Kaesten zerlegt, jeder mit eigenem Rand.
    .replace(/<\/blockquote>\n<blockquote>/g, " ")
    .replace(/\*\*\[(.*?)\]\*\*/g, '<span class="zeit">[$1]</span>')
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/`(.+?)`/g, "<code>$1</code>")
    .replace(/^- (.*)$/gm, "• $1")
    .replace(/\n/g, "<br>")
    // Ueberschriften und Zitate bringen eigenen Abstand mit. Die <br> aus den
    // Leerzeilen davor und danach kamen obendrauf und rissen Loecher.
    .replace(/(<br>)*(<(?:h[123]|blockquote|hr)>)/g, "$2")
    .replace(/(<\/(?:h[123]|blockquote)>|<hr>)(<br>)+/g, "$1")
    // Platzhalter zurueck, samt der <br> davor und danach: die Tabelle
    // bringt eigenen Abstand mit.
    .replace(/(<br>)*\u0000T(\d+)\u0000(<br>)*/g, (_, a, n) => ablage[+n]);
}

let ablageEintraege = [];

async function ablageLaden(anzeigen = true) {
  try {
    const r = await fetch("/api/liste");
    ablageEintraege = await r.json();
    // Nicht ueberschreiben, was inzwischen wiederhergestellt wurde.
    if (anzeigen && !buehneBelegt) ablageZeigen();
  } catch (e) {
    if (anzeigen) buehne("Ablage", "Protokolle und Recherchen",
                         '<div class="b-leer">Ablage nicht erreichbar.</div>');
  }
}

function ablageZeigen() {
  buehne("Ablage", "Protokolle und Recherchen", "",
         ablageEintraege.length ? `${ablageEintraege.length} Einträge` : "");
  const lauf = $("b-inhalt").firstChild;
  if (!ablageEintraege.length) {
    lauf.innerHTML = '<div class="b-leer">Noch nichts da. Eine Aufzeichnung wird '
      + "beim Stoppen automatisch protokolliert.</div>";
    return;
  }
  for (const e of ablageEintraege) {
    const d = document.createElement("div");
    d.className = "eintrag";
    d.innerHTML = `<span class="art ${e.art}">${e.art}</span>`
      + `<span class="wann">${wannText(e.geaendert)}</span>`
      + `<span class="titel"></span>`;
    d.querySelector(".titel").textContent = e.titel;
    d.onclick = () => oeffnen(e);
    lauf.appendChild(d);
  }
}

async function oeffnen(e) {
  const r = await fetch("/api/datei?k=" + encodeURIComponent(e.kennung));
  buehne(e.art === "protokoll" ? "Protokoll" : "Recherche", e.titel,
         alsHtml(await r.text()), wannText(e.geaendert));
}

$("b-zurueck").onclick = ablageZeigen;
$("b-neuladen").onclick = () => ablageLaden(true);
ablageLaden(true);

verbinden();
</script>
